name: re-arch tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-go@v5
        with: {go-version: "1.22"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: dtolnay/rust-toolchain@stable
      - uses: shivammathur/setup-php@v2
        with: {php-version: "8.3"}
      - name: Scanner copies in sync
        run: python3 tools/sync.py --check
      - name: Playwright for the rendering check
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Test suite
        run: python3 tests/test_suite.py -v
